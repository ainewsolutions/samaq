<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سمك | SAMAQ — منيو الطلب أونلاين</title>
<meta name="description" content="منيو سمك SAMAQ — منتجات بحرية طازجة، اطلب الآن عبر واتساب" />

<!-- خطوط عربية (بديل عن The Sans غير المتاح كويب فونت) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Tailwind مبني مسبقًا (Static) بدل تحميل المكتبة كاملة وتشغيلها -->
<link rel="stylesheet" href="css/tailwind-built.css" />
<link rel="stylesheet" href="css/styles.css" />

<!-- React + ReactDOM محفوظين محليًا (مش من CDN خارجي) لسرعة أعلى وموثوقية أفضل -->
<script src="js/vendor/react.js"></script>
<script src="js/vendor/react-dom.js"></script>
</head>
<body>
<div id="root"></div>

<!-- طبقة البيانات (Google Sheets عن طريق Apps Script) -->
<script src="js/config.js"></script>
<script src="js/dataService.js"></script>

<!-- Components — مبنية مسبقًا (Pre-compiled) من ملفات JSX المصدرية،
     فمفيش أي تحويل أو ترجمة بتحصل في المتصفح خالص — بيتحمّلوا
     ويتنفذوا على طول زي أي سكريبت عادي، وده أسرع بكتير. -->
<script src="js/icons.compiled.js"></script>
<script src="js/imageUploader.compiled.js"></script>
<script src="js/menu.compiled.js"></script>
<script src="js/cart.compiled.js"></script>
<script src="js/layout.compiled.js"></script>
<script src="js/dashboard.compiled.js"></script>
<script src="js/app.compiled.js"></script>
</body>
</html>
