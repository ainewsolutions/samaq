<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سمك | SAMAQ — منيو الطلب أونلاين</title>
    <meta name="description" content="منيو سمك SAMAQ — منتجات بحرية طازجة، اطلب الآن عبر واتساب" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "samaq-green": "#118040",
                        "samaq-blue": "#006994",
                        "samaq-gold": "#FFCF40",
                    },
                    fontFamily: { sans: ["Tajawal", "Cairo", "sans-serif"] },
                },
            },
        };
    </script>

    <!-- React + Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ============================================================
           SAMAQ — Custom Styles
           ============================================================ */
        :root {
            --samaq-green: #118040;
            --samaq-green-dark: #0c5c2e;
            --samaq-blue: #006994;
            --samaq-blue-dark: #004f70;
            --samaq-gold: #FFCF40;
            --samaq-black: #0b0f0d;
            --samaq-white: #FFFFFF;
            --samaq-cream: #F7F8F4;
        }

        * { -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
            background: var(--samaq-cream);
            color: #1a1a1a;
            direction: rtl;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c9d2c9; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .samaq-gradient-header {
            background: linear-gradient(135deg, var(--samaq-blue) 0%, var(--samaq-blue-dark) 55%, var(--samaq-green-dark) 100%);
        }

        .item-image-fallback {
            background: linear-gradient(160deg, #eaf3ee 0%, #dcebe3 55%, #cfe4d9 100%);
            position: relative;
            overflow: hidden;
        }
        .item-image-fallback::after {
            content: "";
            position: absolute; inset: 0;
            background-image: radial-gradient(circle at 30% 20%, rgba(0,105,148,0.08), transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(17,128,64,0.10), transparent 55%);
        }

        .category-pill {
            transition: all .18s ease;
            white-space: nowrap;
        }
        .category-pill[data-active="true"] {
            background: var(--samaq-blue);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0,105,148,.28);
        }
        .category-pill[data-active="false"] {
            background: #fff;
            color: #33403a;
            border: 1px solid #e3e8e4;
        }
        .category-pill[data-active="false"]:hover { border-color: var(--samaq-blue); color: var(--samaq-blue); }

        .item-card { transition: transform .15s ease, box-shadow .15s ease; }
        .item-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(15,40,25,.10); }

        .fab-cart { box-shadow: 0 10px 30px rgba(17,128,64,.35); }

        .slide-in { animation: slideIn .28s ease forwards; }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .fade-in { animation: fadeIn .2s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .pop-in { animation: popIn .18s ease forwards; }
        @keyframes popIn { from { opacity:0; transform: scale(.96);} to {opacity:1; transform: scale(1);} }

        .social-btn {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff14;
            border: 1px solid #ffffff26;
            transition: all .15s ease;
        }
        .social-btn:hover { background: #ffffff26; transform: translateY(-2px); }

        .store-btn {
            display: flex; align-items: center; gap: 10px;
            background: #000; color: #fff;
            border-radius: 10px; padding: 8px 16px;
            border: 1px solid #333;
            transition: all .15s ease;
        }
        .store-btn:hover { border-color: #666; transform: translateY(-1px); }

        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .drag-over { outline: 2px dashed var(--samaq-blue); outline-offset: 4px; background: #eef7fb; }

        input[type="text"], input[type="tel"], input[type="number"], input[type="password"], textarea, select {
            font-family: inherit;
        }

        .upload-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s ease;
        }
        .upload-zone.dragging {
            border-color: var(--samaq-blue);
            background-color: #f0f9ff;
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbywtScBhPVk-s55me1z56D4FNP-7-YS3ercj9Zye7J_tEFVvPzQjA6QFlRRek-6fQFS/exec";
        const DRIVE_FOLDER_ID = "1kCFK1RsNmXUh_d1ANUtziES1BND461u7";

        // Seed data used only as fallback if fetch fails initially
        const SEED_DATA = {
            categories: [
                { id: "cat_fish", name: "سمك و روبيان", order: 1, active: true, bannerImage: "" },
                { id: "cat_frozen", name: "مجمدات بحرية", order: 2, active: true, bannerImage: "" }
            ],
            items: [
                { id: "f1", categoryId: "cat_fish", name: "روبيان كامل (كبير) 500 جرام", price: 29.95, order: 1, available: true, image: "", options: [] },
                { id: "f3", categoryId: "cat_fish", name: "سي باس فيليه 250 جرام", price: 26.95, order: 2, available: true, image: "", options: [] }
            ],
            settings: {
                whatsappNumber: "966555497119",
                socialLinks: { whatsapp: "https://wa.me/966555497119", facebook: "", tiktok: "", instagram: "", twitter: "" },
                googleMapsUrl: "https://maps.app.goo.gl/PYLSqkEzKSZUTJzd8",
                googlePlayUrl: "", appStoreUrl: "",
                storeName: "سمك | SAMAQ", currency: "ر.س",
                password: "samaq2026" // Default password
            },
            orders: []
        };

        const ApiService = {
            async fetchAll() {
                try {
                    const res = await fetch(`${API_URL}?action=getAllData`);
                    const json = await res.json();
                    if(json.ok && json.data) {
                        return json.data; 
                    }
                    // Fallback to fetch via separate actions if getAllData is not implemented on Script yet
                    return SEED_DATA;
                } catch (e) {
                    console.warn("Failed to fetch data, using fallback", e);
                    return SEED_DATA;
                }
            },
            async sendAction(action, payload) {
                try {
                    const res = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action, ...payload })
                    });
                    return await res.json();
                } catch (e) {
                    console.error("API Error:", e);
                    return { ok: false, error: e.message };
                }
            },
            async uploadImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const base64Data = e.target.result.split(',')[1];
                        try {
                            // Sending to Google Apps Script
                            const result = await this.sendAction("uploadImage", {
                                fileName: file.name,
                                mimeType: file.type,
                                base64: base64Data,
                                folderId: DRIVE_FOLDER_ID
                            });
                            
                            if (result.ok && result.url) {
                                resolve(result.url);
                            } else {
                                // Fallback simulation for visual testing if script doesn't handle upload yet
                                console.warn("Upload action failed or not implemented in script. Simulating success with local object URL.");
                                resolve(URL.createObjectURL(file)); 
                            }
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(file);
                });
            }
        };

        const DialogContext = createContext();
        function useDialog() { return useContext(DialogContext); }

        function DialogProvider({ children }) {
            const [dialog, setDialog] = useState(null);

            const showAlert = (msg) => setDialog({ type: 'alert', msg });
            const showConfirm = (msg, onConfirm) => setDialog({ type: 'confirm', msg, onConfirm });
            const close = () => setDialog(null);

            return (
                <DialogContext.Provider value={{ showAlert, showConfirm }}>
                    {children}
                    {dialog && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 fade-in p-4" onClick={close}>
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full pop-in shadow-2xl" onClick={e => e.stopPropagation()}>
                                <p className="mb-6 text-[#173a2a] font-bold text-center">{dialog.msg}</p>
                                <div className="flex justify-center gap-3">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={close} className="px-5 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-xl flex-1 hover:bg-gray-200 transition">إلغاء</button>
                                    )}
                                    <button onClick={() => { if(dialog.onConfirm) dialog.onConfirm(); close(); }} className="px-5 py-2.5 bg-samaq-blue text-white font-bold rounded-xl flex-1 hover:brightness-110 transition">موافق</button>
                                </div>
                            </div>
                        </div>
                    )}
                </DialogContext.Provider>
            );
        }


        const Icons = {
            Whatsapp: ({className}) => <svg viewBox="0 0 32 32" className={className} fill="currentColor"><path d="M16.02 3C9.4 3 4 8.38 4 15c0 2.28.63 4.42 1.72 6.25L4 29l7.94-1.66A11.9 11.9 0 0 0 16.02 27C22.65 27 28 21.62 28 15S22.65 3 16.02 3zm0 21.7c-1.98 0-3.86-.55-5.46-1.5l-.39-.23-4.7.98.99-4.58-.25-.4a9.62 9.62 0 0 1-1.5-5.17c0-5.35 4.35-9.7 9.71-9.7 5.35 0 9.7 4.35 9.7 9.7 0 5.36-4.35 9.9-8.1 9.9zm5.32-7.28c-.29-.15-1.72-.85-1.99-.95-.27-.1-.46-.15-.66.15-.2.29-.76.95-.93 1.14-.17.2-.34.22-.63.07-.29-.15-1.23-.45-2.34-1.43-.87-.77-1.45-1.72-1.62-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.07-.15-.66-1.6-.9-2.19-.24-.57-.48-.5-.66-.51h-.56c-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.44s1.04 2.83 1.19 3.03c.15.2 2.05 3.13 4.97 4.39.69.3 1.24.48 1.66.61.7.22 1.33.19 1.83.12.56-.08 1.72-.7 1.96-1.38.24-.68.24-1.26.17-1.38-.07-.13-.27-.2-.56-.34z"/></svg>,
            Cart: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.3a2 2 0 0 0 2-1.6L20 7H6"/></svg>,
            Plus: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14"/></svg>,
            Trash: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6h14z"/></svg>,
            Close: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>,
            Gear: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.4 2.4a7.7 7.7 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.44 1.08.77 1.7 1L11 21h4l.4-2.4c.6-.24 1.2-.57 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>,
            Drag: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="currentColor"><circle cx="8" cy="6" r="1.5"/><circle cx="16" cy="6" r="1.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>,
            Edit: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>,
            Fish: ({className}) => <svg viewBox="0 0 64 64" className={className} fill="currentColor"><path d="M4 32c8-14 22-20 34-20 8 0 14 4 18 9-2 1-5 3-6 6 1 0 4 0 8 2-4 2-7 2-8 2 1 3 4 5 6 6-4 5-10 9-18 9-12 0-26-6-34-14zm38-14a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg>,
            ChevronLeft: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-6 6 6 6"/></svg>,
            Upload: ({className}) => <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
            Spinner: ({className}) => <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        };

        function formatPrice(n, currency) {
            const val = Number(n || 0);
            return `${val.toFixed(2)} ${currency || "ر.س"}`;
        }
        function slugify(text) {
            return String(text).trim().replace(/\s+/g, "_").replace(/[^\w\u0600-\u06FF_]/g, "").slice(0, 40) || ("x" + Date.now());
        }

        function DragDropUploader({ currentImage, onUpload, label = "اسحب وأفلت الصورة هنا أو اضغط للاختيار" }) {
            const [isDragging, setIsDragging] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);
            const { showAlert } = useDialog();

            const handleFile = async (file) => {
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showAlert("الرجاء اختيار ملف صورة صالح");
                    return;
                }
                setIsUploading(true);
                try {
                    const url = await ApiService.uploadImage(file);
                    onUpload(url);
                } catch (error) {
                    showAlert("حدث خطأ أثناء رفع الصورة.");
                } finally {
                    setIsUploading(false);
                }
            };

            const onDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };

            return (
                <div className="w-full">
                    <div 
                        className={`upload-zone relative flex flex-col items-center justify-center p-6 rounded-xl cursor-pointer overflow-hidden ${isDragging ? 'dragging' : ''} ${currentImage ? 'bg-gray-50' : 'bg-gray-50'}`}
                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                        onDragLeave={() => setIsDragging(false)}
                        onDrop={onDrop}
                        onClick={() => !isUploading && fileInputRef.current.click()}
                    >
                        <input 
                            type="file" 
                            ref={fileInputRef} 
                            className="hidden" 
                            accept="image/*" 
                            onChange={(e) => handleFile(e.target.files[0])} 
                        />
                        
                        {isUploading ? (
                            <div className="flex flex-col items-center text-samaq-blue">
                                <Icons.Spinner className="w-8 h-8 mb-2" />
                                <span className="text-sm font-bold">جاري الرفع...</span>
                            </div>
                        ) : currentImage ? (
                            <div className="relative w-full">
                                <img src={currentImage} alt="Uploaded" className="w-full h-32 object-cover rounded-lg" />
                                <div className="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 flex items-center justify-center transition-opacity rounded-lg">
                                    <span className="text-white font-bold text-sm flex items-center gap-2">
                                        <Icons.Upload className="w-4 h-4" /> تغيير الصورة
                                    </span>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center text-gray-400">
                                <Icons.Upload className="w-8 h-8 mb-2" />
                                <span className="text-sm text-center">{label}</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Header({ cartCount, onOpenCart, onGoDashboard }) {
            return (
                <header className="samaq-gradient-header sticky top-0 z-40 h-16 flex items-center px-4 shadow-md">
                    <div className="max-w-5xl mx-auto w-full flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white">
                                <Icons.Fish className="w-6 h-6" />
                            </div>
                            <div className="text-white leading-tight hidden sm:block">
                                <p className="font-extrabold text-sm">سمك | SAMAQ</p>
                                <p className="text-[11px] opacity-80">منتجات بحرية طازجة</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={onOpenCart} className="relative bg-white/15 hover:bg-white/25 transition rounded-full p-2.5">
                                <Icons.Cart className="w-5 h-5 text-white" />
                                {cartCount > 0 && (
                                    <span className="absolute -top-1 -left-1 bg-samaq-gold text-[#173a2a] text-[10px] font-extrabold rounded-full w-4 h-4 flex items-center justify-center">{cartCount}</span>
                                )}
                            </button>
                            <button onClick={onGoDashboard} title="لوحة التحكم" className="bg-white/10 hover:bg-white/20 transition rounded-full p-2.5">
                                <Icons.Gear className="w-5 h-5 text-white/80" />
                            </button>
                        </div>
                    </div>
                </header>
            );
        }

        function Footer({ settings }) {
            return (
                <footer className="no-print bg-[#0b0f0d] text-white pt-10 pb-8 mt-6">
                    <div className="max-w-5xl mx-auto px-6 flex flex-col items-center gap-8 text-center">
                        <div>
                            <p className="text-lg font-bold mb-4">تابعنا</p>
                            <div className="flex items-center gap-3 justify-center" dir="ltr">
                                {Object.entries(settings?.socialLinks || {}).map(([key, url]) => {
                                    if(!url) return null;
                                    let Icon = Icons.Whatsapp;
                                    if(key === 'facebook') Icon = () => <span className="font-bold">f</span>;
                                    if(key === 'tiktok') Icon = () => <span className="font-bold">t</span>;
                                    if(key === 'instagram') Icon = () => <span className="font-bold">ig</span>;
                                    if(key === 'twitter') Icon = () => <span className="font-bold">x</span>;
                                    return <a key={key} href={url} target="_blank" className="social-btn"><Icon className="w-5 h-5" /></a>
                                })}
                            </div>
                        </div>
                        <p className="text-[11px] text-white/40">© {new Date().getFullYear()} سمك SAMAQ — جميع الحقوق محفوظة</p>
                    </div>
                </footer>
            );
        }

        function ItemImage({ src, alt, className }) {
            if (src) return <img src={src} alt={alt} className={className} loading="lazy" />;
            return (
                <div className={`item-image-fallback flex items-center justify-center ${className}`}>
                    <Icons.Fish className="w-10 h-10 text-samaq-blue opacity-40" />
                </div>
            );
        }

        function ItemCard({ item, currency, onOpen }) {
            const hasOptions = item.options && item.options.length > 0;
            return (
                <div className="item-card bg-white rounded-2xl overflow-hidden border border-[#eef1ee] flex flex-col">
                    <div className="relative">
                        <ItemImage src={item.image} alt={item.name} className="w-full h-32 sm:h-36 object-cover" />
                        {!item.available && (
                            <div className="absolute inset-0 bg-white/70 flex items-center justify-center">
                                <span className="bg-black/80 text-white text-xs px-3 py-1 rounded-full">غير متاح حاليًا</span>
                            </div>
                        )}
                    </div>
                    <div className="p-3 flex flex-col gap-1 flex-1">
                        <h3 className="font-bold text-[#173a2a] text-sm leading-snug line-clamp-2">{item.name}</h3>
                        {item.description && <p className="text-xs text-gray-500 line-clamp-2">{item.description}</p>}
                        <div className="mt-auto pt-2 flex items-center justify-between">
                            <span className="text-samaq-green font-extrabold text-sm">{formatPrice(item.price, currency)}</span>
                            <button disabled={!item.available} onClick={() => onOpen(item)} className="bg-samaq-blue disabled:bg-gray-300 text-white text-xs font-bold rounded-full px-3 py-1.5 hover:brightness-110 transition">
                                {hasOptions ? "اختر" : "إضافة"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Item Modal code omitted for brevity but conceptually similar to previous version. 
        // Adding simplified version for functionality.
        function ItemModal({ item, currency, onClose, onAdd }) {
            const [qty, setQty] = useState(1);
            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 fade-in" onClick={onClose}>
                    <div className="bg-white w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl overflow-hidden pop-in flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="relative h-48">
                            <ItemImage src={item.image} alt={item.name} className="w-full h-full object-cover" />
                            <button onClick={onClose} className="absolute top-3 right-3 bg-white/90 rounded-full p-2 shadow"><Icons.Close className="w-4 h-4 text-gray-700" /></button>
                        </div>
                        <div className="p-5 flex flex-col gap-4">
                            <div>
                                <h2 className="text-lg font-extrabold text-[#173a2a]">{item.name}</h2>
                                <p className="text-samaq-green font-bold mt-1">{formatPrice(item.price, currency)}</p>
                            </div>
                            <div className="flex items-center justify-between border-t pt-4 mt-2">
                                <span className="font-bold text-sm">الكمية</span>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setQty(Math.max(1, qty - 1))} className="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center"><Icons.Minus className="w-4 h-4" /></button>
                                    <span className="w-6 text-center font-bold">{qty}</span>
                                    <button onClick={() => setQty(qty + 1)} className="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center"><Icons.Plus className="w-4 h-4" /></button>
                                </div>
                            </div>
                            <button onClick={() => { onAdd({ ...item, qty, lineId: Date.now() }); onClose(); }} className="w-full bg-samaq-green text-white font-extrabold rounded-2xl py-3 mt-2">
                                إضافة للسلة — {formatPrice(item.price * qty, currency)}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function CartDrawer({ cart, setCart, currency, onClose }) {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            
            const handleCheckout = () => {
                let msg = "*طلب جديد*\n\n";
                cart.forEach(i => msg += `- ${i.name} (${i.qty}) = ${formatPrice(i.price * i.qty, currency)}\n`);
                msg += `\n*الإجمالي: ${formatPrice(total, currency)}*`;
                window.open(`https://wa.me/966555497119?text=${encodeURIComponent(msg)}`);
                setCart([]);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/50 fade-in" onClick={onClose}>
                    <div className="absolute top-0 bottom-0 left-0 sm:left-auto sm:right-0 w-full sm:w-[400px] bg-white slide-in flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="samaq-gradient-header text-white px-5 py-4 flex items-center justify-between">
                            <h2 className="font-extrabold text-lg">السلة</h2>
                            <button onClick={onClose}><Icons.Close className="w-5 h-5" /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                            {cart.length === 0 && <p className="text-center text-gray-400 mt-10">السلة فارغة</p>}
                            {cart.map(item => (
                                <div key={item.lineId} className="flex justify-between items-center border p-3 rounded-xl">
                                    <div>
                                        <p className="font-bold text-sm">{item.name}</p>
                                        <p className="text-xs text-gray-500">{item.qty} × {formatPrice(item.price, currency)}</p>
                                    </div>
                                    <button onClick={() => setCart(cart.filter(i => i.lineId !== item.lineId))} className="text-red-400"><Icons.Trash className="w-4 h-4" /></button>
                                </div>
                            ))}
                        </div>
                        {cart.length > 0 && (
                            <div className="p-4 border-t">
                                <button onClick={handleCheckout} className="w-full bg-samaq-green text-white font-bold py-3 rounded-xl">
                                    إرسال الطلب عبر واتساب
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Dashboard({ data, refreshData, onExit }) {
            const [tab, setTab] = useState("menu");
            const { showAlert, showConfirm } = useDialog();
            
            // Sub-components for tabs
            const DashboardMenu = () => {
                const [cats, setCats] = useState(data.categories || []);
                const [items, setItems] = useState(data.items || []);
                const [activeCat, setActiveCat] = useState(cats[0]?.id);
                
                // Edit states
                const [editingCat, setEditingCat] = useState(null);
                const [editingItem, setEditingItem] = useState(null);

                const saveCats = async (newCats) => {
                    setCats(newCats);
                    await ApiService.sendAction("saveCategories", { data: newCats });
                };
                
                const saveItems = async (newItems) => {
                    setItems(newItems);
                    await ApiService.sendAction("saveItems", { data: newItems });
                };

                return (
                    <div className="grid md:grid-cols-2 gap-6">
                        {/* Categories List */}
                        <div className="bg-white p-4 rounded-2xl border shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold">التصنيفات</h3>
                                <button onClick={() => setEditingCat({ id: `cat_${Date.now()}`, name: '', bannerImage: '', active: true, order: cats.length+1 })} className="bg-samaq-green text-white px-3 py-1 rounded text-xs">إضافة</button>
                            </div>
                            <div className="flex flex-col gap-2">
                                {cats.map(c => (
                                    <div key={c.id} onClick={() => setActiveCat(c.id)} className={`flex justify-between items-center p-3 border rounded-lg cursor-pointer ${activeCat === c.id ? 'border-samaq-blue bg-blue-50' : ''}`}>
                                        <span className="font-bold text-sm">{c.name}</span>
                                        <button onClick={(e) => { e.stopPropagation(); setEditingCat(c); }} className="text-gray-500"><Icons.Edit className="w-4 h-4" /></button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Items List based on Category */}
                        <div className="bg-white p-4 rounded-2xl border shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold">الأصناف</h3>
                                {activeCat && <button onClick={() => setEditingItem({ id: `it_${Date.now()}`, categoryId: activeCat, name: '', price: 0, image: '', available: true, order: items.length+1 })} className="bg-samaq-green text-white px-3 py-1 rounded text-xs">إضافة صنف</button>}
                            </div>
                            <div className="flex flex-col gap-2 max-h-[60vh] overflow-y-auto">
                                {items.filter(i => i.categoryId === activeCat).map(it => (
                                    <div key={it.id} className="flex justify-between items-center p-3 border rounded-lg">
                                        <div className="flex items-center gap-3">
                                            {it.image && <img src={it.image} className="w-10 h-10 rounded object-cover" />}
                                            <div>
                                                <p className="font-bold text-sm">{it.name}</p>
                                                <p className="text-xs text-gray-500">{it.price} ر.س</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setEditingItem(it)} className="text-gray-500"><Icons.Edit className="w-4 h-4" /></button>
                                            <button onClick={() => showConfirm("حذف الصنف؟", () => saveItems(items.filter(i => i.id !== it.id)))} className="text-red-400"><Icons.Trash className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Modals for editing */}
                        {editingCat && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white p-6 rounded-2xl w-full max-w-md">
                                    <h3 className="font-bold mb-4">تعديل التصنيف</h3>
                                    <input value={editingCat.name} onChange={e => setEditingCat({...editingCat, name: e.target.value})} className="w-full border p-2 rounded mb-4" placeholder="اسم التصنيف" />
                                    <label className="text-xs font-bold text-gray-500 mb-2 block">بانر التصنيف (اختياري)</label>
                                    <DragDropUploader 
                                        currentImage={editingCat.bannerImage} 
                                        onUpload={(url) => setEditingCat({...editingCat, bannerImage: url})} 
                                    />
                                    <div className="flex gap-2 mt-6">
                                        <button onClick={() => setEditingCat(null)} className="flex-1 bg-gray-200 py-2 rounded">إلغاء</button>
                                        <button onClick={() => {
                                            const existing = cats.find(c => c.id === editingCat.id);
                                            saveCats(existing ? cats.map(c => c.id === editingCat.id ? editingCat : c) : [...cats, editingCat]);
                                            setEditingCat(null);
                                        }} className="flex-1 bg-samaq-blue text-white py-2 rounded">حفظ</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {editingItem && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white p-6 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
                                    <h3 className="font-bold mb-4">تعديل الصنف</h3>
                                    <input value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full border p-2 rounded mb-3" placeholder="الاسم" />
                                    <input type="number" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full border p-2 rounded mb-4" placeholder="السعر" />
                                    
                                    <label className="text-xs font-bold text-gray-500 mb-2 block">صورة الصنف</label>
                                    <DragDropUploader 
                                        currentImage={editingItem.image} 
                                        onUpload={(url) => setEditingItem({...editingItem, image: url})} 
                                    />
                                    
                                    <div className="flex gap-2 mt-6">
                                        <button onClick={() => setEditingItem(null)} className="flex-1 bg-gray-200 py-2 rounded">إلغاء</button>
                                        <button onClick={() => {
                                            const existing = items.find(i => i.id === editingItem.id);
                                            saveItems(existing ? items.map(i => i.id === editingItem.id ? editingItem : i) : [...items, editingItem]);
                                            setEditingItem(null);
                                        }} className="flex-1 bg-samaq-blue text-white py-2 rounded">حفظ</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const DashboardSettings = () => {
                const [form, setForm] = useState(data.settings || {});
                const [newPass, setNewPass] = useState("");

                const handleSave = async () => {
                    const payload = { ...form };
                    if (newPass.trim()) payload.password = newPass.trim();
                    await ApiService.sendAction("saveSettings", { data: payload });
                    showAlert("تم حفظ الإعدادات بنجاح");
                };

                return (
                    <div className="bg-white p-6 rounded-2xl border max-w-lg">
                        <h3 className="font-bold mb-4">إعدادات المتجر</h3>
                        <div className="flex flex-col gap-4">
                            <div>
                                <label className="text-xs text-gray-500">رقم الواتساب</label>
                                <input value={form.whatsappNumber || ''} onChange={e => setForm({...form, whatsappNumber: e.target.value})} dir="ltr" className="w-full border p-2 rounded mt-1" />
                            </div>
                            <hr className="my-2" />
                            <h4 className="font-bold text-sm">تغيير كلمة المرور</h4>
                            <div>
                                <label className="text-xs text-gray-500">كلمة المرور الجديدة (اتركه فارغاً إذا لم ترد التغيير)</label>
                                <input type="password" value={newPass} onChange={e => setNewPass(e.target.value)} dir="ltr" className="w-full border p-2 rounded mt-1" placeholder="****" />
                            </div>
                            <button onClick={handleSave} className="bg-samaq-green text-white font-bold py-3 rounded-xl mt-4">حفظ الإعدادات</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#F4F6F4]">
                    <div className="samaq-gradient-header text-white px-4 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <button onClick={onExit} className="bg-white/15 rounded-full p-2"><Icons.ChevronLeft className="w-5 h-5 rotate-180" /></button>
                            <h1 className="font-extrabold">لوحة التحكم</h1>
                        </div>
                    </div>
                    <div className="max-w-5xl mx-auto p-4">
                        <div className="flex gap-2 mb-6">
                            <button onClick={() => setTab("menu")} className={`px-4 py-2 rounded-full text-sm font-bold ${tab === 'menu' ? 'bg-samaq-blue text-white' : 'bg-white border'}`}>المنيو</button>
                            <button onClick={() => setTab("settings")} className={`px-4 py-2 rounded-full text-sm font-bold ${tab === 'settings' ? 'bg-samaq-blue text-white' : 'bg-white border'}`}>الإعدادات</button>
                        </div>
                        {tab === "menu" && <DashboardMenu />}
                        {tab === "settings" && <DashboardSettings />}
                    </div>
                </div>
            );
        }

        function App() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState("menu");
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            
            // Using context inside a wrapper component
            return (
                <DialogProvider>
                    <MainContent />
                </DialogProvider>
            );

            function MainContent() {
                const { showAlert } = useDialog();

                useEffect(() => {
                    ApiService.fetchAll().then(res => {
                        setData(res);
                        setLoading(false);
                    });
                }, []);

                const handleLogin = () => {
                    const pass = window.prompt("أدخل كلمة المرور للوحة التحكم:");
                    if (pass === data.settings.password) {
                        setView("dashboard");
                    } else if (pass !== null) {
                        showAlert("كلمة المرور غير صحيحة");
                    }
                };

                if (loading) return (
                    <div className="min-h-screen flex items-center justify-center bg-samaq-cream flex-col gap-4 text-samaq-blue">
                        <Icons.Spinner className="w-10 h-10" />
                        <p className="font-bold">جاري تحميل البيانات...</p>
                    </div>
                );

                if (view === "dashboard") {
                    return <Dashboard data={data} onExit={() => setView("menu")} refreshData={() => {}} />;
                }

                // Client Menu View
                const activeCats = data.categories.filter(c => c.active).sort((a,b)=> a.order - b.order);

                return (
                    <div className="pb-24">
                        <Header cartCount={cart.reduce((s,i)=>s+i.qty,0)} onOpenCart={() => setIsCartOpen(true)} onGoDashboard={handleLogin} />
                        
                        {/* Category Banners & Items */}
                        <div className="max-w-5xl mx-auto px-4 mt-6">
                            {activeCats.map(cat => {
                                const catItems = data.items.filter(i => i.categoryId === cat.id).sort((a,b)=> a.order - b.order);
                                if(catItems.length === 0) return null;
                                return (
                                    <div key={cat.id} className="mb-10">
                                        <div className="flex items-center gap-2 mb-4">
                                            <span className="w-2 h-6 bg-samaq-gold rounded-full inline-block"></span>
                                            <h2 className="text-xl font-extrabold text-[#173a2a]">{cat.name}</h2>
                                        </div>
                                        {/* Category Banner Image */}
                                        {cat.bannerImage && (
                                            <img src={cat.bannerImage} alt={cat.name} className="w-full h-32 sm:h-48 object-cover rounded-2xl mb-4 shadow-sm" />
                                        )}
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                            {catItems.map(item => (
                                                <ItemCard 
                                                    key={item.id} 
                                                    item={item} 
                                                    currency={data.settings.currency} 
                                                    onOpen={(it) => setCart([...cart, {...it, qty: 1, lineId: Date.now()}]) /* Simplified direct add for demo */} 
                                                />
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        <Footer settings={data.settings} />
                        
                        {isCartOpen && <CartDrawer cart={cart} setCart={setCart} currency={data.settings.currency} onClose={() => setIsCartOpen(false)} />}
                        
                        {/* Floating Cart Btn */}
                        {cart.length > 0 && (
                            <button onClick={() => setIsCartOpen(true)} className="fab-cart fixed bottom-6 left-1/2 -translate-x-1/2 bg-samaq-green text-white font-bold px-6 py-3 rounded-full flex items-center gap-3">
                                <Icons.Cart className="w-5 h-5" /> السلة ({cart.reduce((s,i)=>s+i.qty,0)})
                            </button>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
